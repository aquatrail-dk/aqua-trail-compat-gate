<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Aqua Trail — Compatibility Gate</title>
  <style>
    :root{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#102a43;background:#f4f8fb}
    body{margin:0;padding:24px}
    main{max-width:820px;margin:auto;background:#fff;border:1px solid #d9e2ec;border-radius:16px;padding:24px;box-shadow:0 8px 30px rgba(16,42,67,.08)}
    h1{margin-top:0;font-size:1.55rem}
    .note{background:#eef7ff;border-left:4px solid #2684ff;padding:12px 14px;border-radius:8px;margin:14px 0}
    label{display:block;font-weight:700;margin:18px 0 6px}
    input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #bcccdc;border-radius:9px;font:inherit}
    .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
    button{border:0;border-radius:9px;padding:12px 16px;font-weight:700;cursor:pointer;background:#0b7285;color:white}
    button.secondary{background:#486581}
    pre{white-space:pre-wrap;word-break:break-word;background:#102a43;color:#e6fffa;padding:14px;border-radius:10px;min-height:160px}
    .status{font-weight:800;margin-top:18px}
    .pass{color:#087f5b}.fail{color:#c92a2a}.pending{color:#8d6e00}
    small{color:#627d98}
  </style>
</head>
<body>
<main>
  <h1>AQUA TRAIL — Compatibility Gate</h1>
  <p>Test isolato: <strong>GitHub Pages → Apps Script → Google Sheets</strong>.</p>
  <div class="note">
    Questo test NON usa il sito Aqua Trail reale e NON usa il database principale.
    Inserisci l'URL <strong>/exec</strong> della Web App Apps Script quando sarà disponibile.
  </div>

  <label for="endpoint">URL Web App Apps Script</label>
  <input id="endpoint" type="url" placeholder="https://script.google.com/macros/s/.../exec" autocomplete="off">
  <small>L'URL non viene salvato.</small>

  <div class="row">
    <button id="getBtn">1. TEST GET</button>
    <button id="postBtn">2. TEST POST</button>
    <button id="readBtn" class="secondary">3. READBACK</button>
    <button id="allBtn" class="secondary">ESEGUI TUTTO</button>
  </div>

  <div id="status" class="status pending">STATO: NON ESEGUITO</div>
  <pre id="out">Pronto.</pre>
</main>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const out = $('out');
  const status = $('status');

  function endpoint() {
    const value = $('endpoint').value.trim();
    if (!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec(?:\?.*)?$/.test(value)) {
      throw new Error('Inserisci un URL Apps Script Web App valido che termini con /exec.');
    }
    return value.split('?')[0];
  }

  function show(label, data) {
    out.textContent = label + '\n\n' + JSON.stringify(data, null, 2);
  }

  function setStatus(kind, text) {
    status.className = 'status ' + kind;
    status.textContent = 'STATO: ' + text;
  }

  async function readJsonResponse(res) {
    const text = await res.text();
    let data;
    try { data = JSON.parse(text); }
    catch (_) {
      throw new Error('Risposta non JSON (HTTP ' + res.status + '): ' + text.slice(0,500));
    }
    if (!res.ok || !data.ok) throw new Error('HTTP/API FAIL: ' + JSON.stringify(data));
    return data;
  }

  async function testGet() {
    setStatus('pending','GET IN CORSO');
    const res = await fetch(endpoint() + '?action=health&_=' + Date.now(), {
      method:'GET', credentials:'omit', redirect:'follow', cache:'no-store'
    });
    const data = await readJsonResponse(res);
    show('GET PASS', data);
    setStatus('pass','GET PASS');
    return data;
  }

  async function testPost() {
    setStatus('pending','POST IN CORSO');
    const payload = {
      message:'AQUA TRAIL GitHub Pages compatibility test',
      origin:location.origin,
      userAgent:navigator.userAgent,
      clientTime:new Date().toISOString()
    };
    const res = await fetch(endpoint(), {
      method:'POST',
      credentials:'omit',
      redirect:'follow',
      cache:'no-store',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify(payload)
    });
    const data = await readJsonResponse(res);
    show('POST PASS', data);
    setStatus('pass','POST PASS');
    return data;
  }

  async function testReadback() {
    setStatus('pending','READBACK IN CORSO');
    const res = await fetch(endpoint() + '?action=readback&_=' + Date.now(), {
      method:'GET', credentials:'omit', redirect:'follow', cache:'no-store'
    });
    const data = await readJsonResponse(res);
    if (!data.last || !data.last.requestId) {
      throw new Error('Nessuna riga di test trovata nel foglio.');
    }
    show('READBACK PASS', data);
    setStatus('pass','READBACK PASS');
    return data;
  }

  async function run(fn) {
    try { return await fn(); }
    catch (err) {
      setStatus('fail','FAIL');
      show('FAIL',{message:err.message});
      throw err;
    }
  }

  $('getBtn').onclick = () => run(testGet);
  $('postBtn').onclick = () => run(testPost);
  $('readBtn').onclick = () => run(testReadback);
  $('allBtn').onclick = () => run(async () => {
    const get = await testGet();
    const post = await testPost();
    const readback = await testReadback();
    const result = {get,post,readback};
    show('COMPATIBILITY GATE PASS',result);
    setStatus('pass','COMPATIBILITY GATE PASS');
    return result;
  });
})();
</script>
</body>
</html>
