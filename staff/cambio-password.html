<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="assets/styles.css"><title>Cambio password · Aqua Trail</title></head><body data-admin="1" class="login-admin-page">
<header class="header"><div class="container nav"><a class="brand" href="../index.html"><div class="brand-main"><img class="dk-mark" src="assets/logo-dk.png" alt="Logo DK"><div class="brand-copy"><strong>DK Centro Acquatico Cinofilo</strong><span>Aqua Trail® · cambio password</span></div></div></a></div></header>
<main><section class="page-hero admin-hero"><div class="container"><div class="kicker">RECOVERY ACCOUNT</div><h1>Imposta una nuova password</h1><p>Stai usando una password provvisoria generata dal SUPERADMIN. Scegli ora una nuova password personale.</p></div></section><section><div class="container"><div class="panel login-panel"><form id="pwdForm" class="form-grid single"><label>Password provvisoria / attuale<input id="pwd0" type="password" autocomplete="current-password"></label><label>Nuova password<input id="pwd1" type="password" minlength="14" autocomplete="new-password"></label><label>Ripeti nuova password<input id="pwd2" type="password" minlength="14" autocomplete="new-password"></label><button class="btn btn-primary" type="submit">SALVA NUOVA PASSWORD</button><div id="pwdMsg" class="notice hidden"></div></form></div></div></section></main>
<footer class="footer"><div class="container footer-row"><div class="powered">@2026 Powered by Bruno &amp; Aaron</div></div></footer>
<script src="assets/build-info.js"></script><script src="data/runtime-config.js"></script><script src="assets/data-api-adapter.js"></script><script src="assets/app-bootstrap.js"></script><script src="assets/web-conformance.js"></script><script src="assets/store.js"></script><script>
ATApp.onReady(()=>{const s=ATStore.requireSession();if(!s)return;if(!s.force_password_change){location.replace(s.role==='SUPERADMIN'?'superadmin.html':s.role==='GIUDICE'?'gara-giudice.html':s.role==='CENTRO_ASSOCIATO'?'centro-evento.html':s.role==='FRONT_OFFICE'?'frontoffice.html':'admin.html');return}document.getElementById('pwdForm').onsubmit=e=>{e.preventDefault();const a=document.getElementById('pwd1').value,b=document.getElementById('pwd2').value,m=document.getElementById('pwdMsg');const current=document.getElementById('pwd0').value;if(a.length<14){m.className='notice warn';m.textContent='Usa almeno 14 caratteri.';return}if(a!==b){m.className='notice warn';m.textContent='Le due password non coincidono.';return}if(window.ATDataAPI?.isOnline?.()){ATDataAPI.changePassword(current,a,b).then(()=>{m.className='notice ok';m.textContent='Password aggiornata. Effettua nuovamente l’accesso.';setTimeout(()=>location.replace('login-admin.html'),600)}).catch(err=>{m.className='notice warn';m.textContent=err.message||'Operazione non riuscita.'});return}const A=ATStore.admin(),acc=(A.offline_accounts||[]).find(x=>x.username===s.username);if(!acc){m.className='notice warn';m.textContent='Account non trovato.';return}acc.password=a;acc.force_password_change=false;acc.password_changed_at=new Date().toISOString();ATStore.saveAdmin(A);const ns={...s,force_password_change:false};sessionStorage.setItem(ATStore.SESSION,JSON.stringify(ns));ATStore.audit('CAMBIO PASSWORD DOPO RESET',s.username,'PASSWORD PROVVISORIA','PASSWORD PERSONALE IMPOSTATA','Cambio obbligatorio al primo accesso');m.className='notice ok';m.textContent='Password aggiornata.';setTimeout(()=>location.replace(s.role==='SUPERADMIN'?'superadmin.html':s.role==='GIUDICE'?'gara-giudice.html':s.role==='CENTRO_ASSOCIATO'?'centro-evento.html':s.role==='FRONT_OFFICE'?'frontoffice.html':'admin.html'),500)};});
</script></body></html>
