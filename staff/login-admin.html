<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="assets/styles.css"><title>Accesso staff · Aqua Trail</title><style>
.login-progress{margin:.9rem 0;color:#25454a}
.login-progress__track{height:6px;overflow:hidden;border-radius:999px;background:#dce8ea}
.login-progress__track span{display:block;width:38%;height:100%;border-radius:inherit;background:#167d88;animation:aqua-login-progress 1.3s ease-in-out infinite}
.login-progress__text{margin:.55rem 0 0;font-size:.92rem;line-height:1.4}
@keyframes aqua-login-progress{from{transform:translateX(-110%)}to{transform:translateX(280%)}}
@media(prefers-reduced-motion:reduce){.login-progress__track span{animation:none;width:100%;opacity:.7}}
</style></head><body class="login-admin-page"><main><section class="page-hero admin-hero"><div class="container"><div class="kicker">AREA STAFF ONLINE</div><h1>Accesso Aqua Trail</h1><p>Identità, ruolo, workspace e scope sono verificati dal backend.</p></div></section><section><div class="container"><div class="panel login-panel"><form id="loginForm" class="form-grid single"><label>Utente<input id="user" autocomplete="username"></label><label>Password<input id="pass" type="password" autocomplete="current-password"></label><button id="loginSubmit" class="btn btn-primary" type="submit">Accedi</button><div id="loginProgress" class="login-progress hidden" role="status" aria-live="polite"><div class="login-progress__track" role="progressbar" aria-label="Verifica accesso in corso" aria-valuetext="In corso"><span></span></div><p id="loginProgressText" class="login-progress__text">Verifica delle credenziali in corso…</p></div><div id="loginError" class="notice warn hidden"></div></form></div></div></section></main><script src="assets/build-info.js"></script><script src="data/runtime-config.js"></script><script src="assets/data-api-adapter.js"></script><script src="assets/app-bootstrap.js"></script><script src="assets/web-conformance.js"></script><script>
(()=>{
  const form=document.getElementById('loginForm');
  const user=document.getElementById('user');
  const pass=document.getElementById('pass');
  const submit=document.getElementById('loginSubmit');
  const progress=document.getElementById('loginProgress');
  const progressText=document.getElementById('loginProgressText');
  const message=document.getElementById('loginError');
  let busy=false;
  form.addEventListener('submit',async e=>{
    e.preventDefault();
    if(busy)return;
    busy=true;
    message.classList.add('hidden');
    progress.classList.remove('hidden');
    form.setAttribute('aria-busy','true');
    submit.disabled=true;
    submit.textContent='Verifica in corso…';
    user.disabled=true;
    pass.disabled=true;
    const started=Date.now();
    let timer=window.setInterval(()=>{
      const seconds=Math.floor((Date.now()-started)/1000);
      progressText.textContent=seconds<15
        ? `Verifica delle credenziali in corso… ${seconds}s`
        : `Il backend non ha ancora risposto (${seconds}s). Mantieni aperta la pagina e non inviare di nuovo.`;
    },1000);
    try{
      const session=await ATDataAPI.login(user.value.trim(),pass.value);
      if(!session)throw new Error('Credenziali non valide.');
      window.clearInterval(timer);
      location.href=session.force_password_change?'cambio-password.html':session.role==='SUPERADMIN'?'admin.html':session.role==='GIUDICE'?'gara-giudice.html':session.role==='CENTRO_ASSOCIATO'?'centro-evento.html':session.role==='FRONT_OFFICE'?'frontoffice.html':'admin.html';
    }catch(err){
      window.clearInterval(timer);
      busy=false;
      progress.classList.add('hidden');
      form.removeAttribute('aria-busy');
      submit.disabled=false;
      submit.textContent='Accedi';
      user.disabled=false;
      pass.disabled=false;
      message.textContent=err?.message||'Accesso non disponibile.';
      message.classList.remove('hidden');
    }
  });
})();
</script></body></html>
