<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="assets/styles.css"><title>Accesso staff · Aqua Trail</title></head><body class="login-admin-page"><main><section class="page-hero admin-hero"><div class="container"><div class="kicker">AREA STAFF ONLINE</div><h1>Accesso Aqua Trail</h1><p>Identità, ruolo, workspace e scope sono verificati dal backend.</p></div></section><section><div class="container"><div class="panel login-panel"><form id="loginForm" class="form-grid single"><label>Utente<input id="user" autocomplete="username"></label><label>Password<input id="pass" type="password" autocomplete="current-password"></label><button class="btn btn-primary" type="submit">Accedi</button><div id="loginError" class="notice warn hidden"></div></form></div></div></section></main><script src="assets/build-info.js"></script><script src="data/runtime-config.js"></script><script src="assets/data-api-adapter.js"></script><script src="assets/app-bootstrap.js"></script><script src="assets/web-conformance.js"></script><script>document.getElementById('loginForm').onsubmit=async e=>{e.preventDefault();const m=document.getElementById('loginError');m.classList.add('hidden');try{const s=await ATDataAPI.login(document.getElementById('user').value.trim(),document.getElementById('pass').value);if(!s)throw new Error('Credenziali non valide.');location.href=s.force_password_change?'cambio-password.html':s.role==='SUPERADMIN'?'admin.html':s.role==='GIUDICE'?'gara-giudice.html':s.role==='CENTRO_ASSOCIATO'?'centro-evento.html':s.role==='FRONT_OFFICE'?'frontoffice.html':'admin.html'}catch(err){m.textContent=err?.message||'Accesso non disponibile.';m.classList.remove('hidden')}};</script></body></html>
